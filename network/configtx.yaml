# Channel configuration for wrt-channel (spec §3).
# configtxgen turns the WRTChannel profile into the channel genesis block.
# MSP paths are relative to this file (FABRIC_CFG_PATH=network/).

Organizations:
  - &OrdererOrg
    Name: OrdererOrg
    ID: OrdererMSP
    MSPDir: organizations/ordererOrganizations/wrt.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererMSP.admin')"
    OrdererEndpoints:
      - orderer.wrt.local:7050

  - &Warehouse
    Name: WarehouseMSP
    ID: WarehouseMSP
    MSPDir: organizations/peerOrganizations/warehouse.wrt.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('WarehouseMSP.admin', 'WarehouseMSP.peer', 'WarehouseMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('WarehouseMSP.admin', 'WarehouseMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('WarehouseMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('WarehouseMSP.peer')"
    AnchorPeers:
      - Host: peer0.warehouse.wrt.local
        Port: 7051

  - &Lender
    Name: LenderMSP
    ID: LenderMSP
    MSPDir: organizations/peerOrganizations/lender.wrt.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('LenderMSP.admin', 'LenderMSP.peer', 'LenderMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('LenderMSP.admin', 'LenderMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('LenderMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('LenderMSP.peer')"
    AnchorPeers:
      - Host: peer0.lender.wrt.local
        Port: 8051

  - &Inspector
    Name: InspectorMSP
    ID: InspectorMSP
    MSPDir: organizations/peerOrganizations/inspector.wrt.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('InspectorMSP.admin', 'InspectorMSP.peer', 'InspectorMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('InspectorMSP.admin', 'InspectorMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('InspectorMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('InspectorMSP.peer')"
    AnchorPeers:
      - Host: peer0.inspector.wrt.local
        Port: 9051

  - &Regulator
    Name: RegulatorMSP
    ID: RegulatorMSP
    MSPDir: organizations/peerOrganizations/regulator.wrt.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('RegulatorMSP.admin', 'RegulatorMSP.peer', 'RegulatorMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('RegulatorMSP.admin', 'RegulatorMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('RegulatorMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('RegulatorMSP.peer')"
    AnchorPeers:
      - Host: peer0.regulator.wrt.local
        Port: 10051

Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_5: true

Application: &ApplicationDefaults
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    # Approving a chaincode definition needs a majority of orgs (3 of 4),
    # mirroring the chaincode endorsement policy.
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    # Default chaincode endorsement policy. deploy-cc.sh sets the explicit
    # OutOf(3, ...) signature policy from spec §3.2, which has the same effect.
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
  Capabilities:
    <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
  OrdererType: etcdraft
  EtcdRaft:
    Consenters:
      - Host: orderer.wrt.local
        Port: 7050
        ClientTLSCert: organizations/ordererOrganizations/wrt.local/orderers/orderer.wrt.local/tls/server.crt
        ServerTLSCert: organizations/ordererOrganizations/wrt.local/orderers/orderer.wrt.local/tls/server.crt
  BatchTimeout: 2s
  BatchSize:
    MaxMessageCount: 10
    AbsoluteMaxBytes: 99 MB
    PreferredMaxBytes: 512 KB
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"

Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    # Changing channel config needs a majority of org admins (docs/GOVERNANCE.md).
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities

Profiles:
  WRTChannel:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg
      Capabilities: *OrdererCapabilities
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *Warehouse
        - *Lender
        - *Inspector
        - *Regulator
      Capabilities: *ApplicationCapabilities
