# Ordering service, one peer per org, one CouchDB per peer (spec §2, §3.1).
# Used together with compose-ca.yaml as one compose project ("wrt").
# Each peer listens on the same port inside and outside Docker, so its TLS
# cert (hosts: peer0.<org>.wrt.local, localhost) works from both sides.

x-couchdb: &couchdb
  image: couchdb:3.4.2
  environment:
    - COUCHDB_USER=admin
    - COUCHDB_PASSWORD=adminpw
  networks: [wrt]

x-peer: &peer
  image: hyperledger/fabric-peer:2.5.16
  working_dir: /root
  command: peer node start
  networks: [wrt]

x-peer-env: &peer-env
  FABRIC_LOGGING_SPEC: INFO
  # The peer starts chaincode containers through the host's Docker daemon,
  # attached to wrt_net so they can reach the peer.
  CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
  CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: wrt_net
  CORE_PEER_TLS_ENABLED: "true"
  CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/server.crt
  CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
  CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/ca.crt
  CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
  CORE_PEER_PROFILE_ENABLED: "false"
  CORE_METRICS_PROVIDER: prometheus
  CORE_LEDGER_STATE_STATEDATABASE: CouchDB
  CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME: admin
  CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD: adminpw

services:
  orderer.wrt.local:
    image: hyperledger/fabric-orderer:2.5.16
    container_name: orderer.wrt.local
    working_dir: /root
    command: orderer
    environment:
      FABRIC_LOGGING_SPEC: INFO
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LISTENPORT: "7050"
      ORDERER_GENERAL_LOCALMSPID: OrdererMSP
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
      ORDERER_GENERAL_TLS_ENABLED: "true"
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      # No system channel: channels are joined through the admin API (osnadmin).
      ORDERER_GENERAL_BOOTSTRAPMETHOD: none
      ORDERER_CHANNELPARTICIPATION_ENABLED: "true"
      ORDERER_ADMIN_TLS_ENABLED: "true"
      ORDERER_ADMIN_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_ADMIN_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_ADMIN_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_ADMIN_TLS_CLIENTROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:7053
      ORDERER_OPERATIONS_LISTENADDRESS: 0.0.0.0:9443
      ORDERER_METRICS_PROVIDER: prometheus
    ports:
      - "7050:7050"
      - "7053:7053"
      - "9443:9443"
    volumes:
      - ../organizations/ordererOrganizations/wrt.local/orderers/orderer.wrt.local/msp:/var/hyperledger/orderer/msp
      - ../organizations/ordererOrganizations/wrt.local/orderers/orderer.wrt.local/tls:/var/hyperledger/orderer/tls
      - orderer.wrt.local:/var/hyperledger/production/orderer
    networks: [wrt]

  # ---------------- Warehouse ----------------
  couchdb.warehouse.wrt.local:
    <<: *couchdb
    container_name: couchdb.warehouse.wrt.local
    ports: ["127.0.0.1:5984:5984"]

  peer0.warehouse.wrt.local:
    <<: *peer
    container_name: peer0.warehouse.wrt.local
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.warehouse.wrt.local
      CORE_PEER_LOCALMSPID: WarehouseMSP
      CORE_PEER_ADDRESS: peer0.warehouse.wrt.local:7051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.warehouse.wrt.local:7052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.warehouse.wrt.local:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.warehouse.wrt.local:7051
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9444
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb.warehouse.wrt.local:5984
    ports: ["7051:7051", "9444:9444"]
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/warehouse.wrt.local/peers/peer0.warehouse.wrt.local/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/warehouse.wrt.local/peers/peer0.warehouse.wrt.local/tls:/etc/hyperledger/fabric/tls
      - peer0.warehouse.wrt.local:/var/hyperledger/production
    depends_on: [couchdb.warehouse.wrt.local]

  # ---------------- Lender ----------------
  couchdb.lender.wrt.local:
    <<: *couchdb
    container_name: couchdb.lender.wrt.local
    ports: ["127.0.0.1:6984:5984"]

  peer0.lender.wrt.local:
    <<: *peer
    container_name: peer0.lender.wrt.local
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.lender.wrt.local
      CORE_PEER_LOCALMSPID: LenderMSP
      CORE_PEER_ADDRESS: peer0.lender.wrt.local:8051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:8051
      CORE_PEER_CHAINCODEADDRESS: peer0.lender.wrt.local:8052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:8052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.lender.wrt.local:8051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.lender.wrt.local:8051
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9445
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb.lender.wrt.local:5984
    ports: ["8051:8051", "9445:9445"]
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/lender.wrt.local/peers/peer0.lender.wrt.local/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/lender.wrt.local/peers/peer0.lender.wrt.local/tls:/etc/hyperledger/fabric/tls
      - peer0.lender.wrt.local:/var/hyperledger/production
    depends_on: [couchdb.lender.wrt.local]

  # ---------------- Inspector ----------------
  couchdb.inspector.wrt.local:
    <<: *couchdb
    container_name: couchdb.inspector.wrt.local
    ports: ["127.0.0.1:7984:5984"]

  peer0.inspector.wrt.local:
    <<: *peer
    container_name: peer0.inspector.wrt.local
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.inspector.wrt.local
      CORE_PEER_LOCALMSPID: InspectorMSP
      CORE_PEER_ADDRESS: peer0.inspector.wrt.local:9051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:9051
      CORE_PEER_CHAINCODEADDRESS: peer0.inspector.wrt.local:9052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:9052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.inspector.wrt.local:9051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.inspector.wrt.local:9051
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9446
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb.inspector.wrt.local:5984
    ports: ["9051:9051", "9446:9446"]
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/inspector.wrt.local/peers/peer0.inspector.wrt.local/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/inspector.wrt.local/peers/peer0.inspector.wrt.local/tls:/etc/hyperledger/fabric/tls
      - peer0.inspector.wrt.local:/var/hyperledger/production
    depends_on: [couchdb.inspector.wrt.local]

  # ---------------- Regulator ----------------
  couchdb.regulator.wrt.local:
    <<: *couchdb
    container_name: couchdb.regulator.wrt.local
    ports: ["127.0.0.1:8984:5984"]

  peer0.regulator.wrt.local:
    <<: *peer
    container_name: peer0.regulator.wrt.local
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.regulator.wrt.local
      CORE_PEER_LOCALMSPID: RegulatorMSP
      CORE_PEER_ADDRESS: peer0.regulator.wrt.local:10051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:10051
      CORE_PEER_CHAINCODEADDRESS: peer0.regulator.wrt.local:10052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:10052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.regulator.wrt.local:10051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.regulator.wrt.local:10051
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9447
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb.regulator.wrt.local:5984
    ports: ["10051:10051", "9447:9447"]
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/regulator.wrt.local/peers/peer0.regulator.wrt.local/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/regulator.wrt.local/peers/peer0.regulator.wrt.local/tls:/etc/hyperledger/fabric/tls
      - peer0.regulator.wrt.local:/var/hyperledger/production
    depends_on: [couchdb.regulator.wrt.local]

volumes:
  orderer.wrt.local:
  peer0.warehouse.wrt.local:
  peer0.lender.wrt.local:
  peer0.inspector.wrt.local:
  peer0.regulator.wrt.local:

networks:
  wrt:
    name: wrt_net
