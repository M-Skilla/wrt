# One Fabric CA per organisation (spec §2, §3.4).
# Each CA is the root of trust for its org's MSP and issues both enrollment
# (identity) certificates and TLS certificates.
# Bootstrap admin admin:adminpw is a local-dev credential only.

x-ca: &ca
  image: hyperledger/fabric-ca:1.5.17
  user: "${UID:-1000}:${GID:-1000}"   # files in organizations/fabric-ca stay owned by you
  command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
  networks: [wrt]

services:
  ca.warehouse.wrt.local:
    <<: *ca
    container_name: ca.warehouse.wrt.local
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-warehouse
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
      - FABRIC_CA_SERVER_CSR_CN=ca.warehouse.wrt.local
      - FABRIC_CA_SERVER_CSR_HOSTS=ca.warehouse.wrt.local,localhost
    ports: ["7054:7054"]
    volumes:
      - ../organizations/fabric-ca/warehouse:/etc/hyperledger/fabric-ca-server

  ca.lender.wrt.local:
    <<: *ca
    container_name: ca.lender.wrt.local
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-lender
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=8054
      - FABRIC_CA_SERVER_CSR_CN=ca.lender.wrt.local
      - FABRIC_CA_SERVER_CSR_HOSTS=ca.lender.wrt.local,localhost
    ports: ["8054:8054"]
    volumes:
      - ../organizations/fabric-ca/lender:/etc/hyperledger/fabric-ca-server

  ca.inspector.wrt.local:
    <<: *ca
    container_name: ca.inspector.wrt.local
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-inspector
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=9054
      - FABRIC_CA_SERVER_CSR_CN=ca.inspector.wrt.local
      - FABRIC_CA_SERVER_CSR_HOSTS=ca.inspector.wrt.local,localhost
    ports: ["9054:9054"]
    volumes:
      - ../organizations/fabric-ca/inspector:/etc/hyperledger/fabric-ca-server

  ca.regulator.wrt.local:
    <<: *ca
    container_name: ca.regulator.wrt.local
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-regulator
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=10054
      - FABRIC_CA_SERVER_CSR_CN=ca.regulator.wrt.local
      - FABRIC_CA_SERVER_CSR_HOSTS=ca.regulator.wrt.local,localhost
    ports: ["10054:10054"]
    volumes:
      - ../organizations/fabric-ca/regulator:/etc/hyperledger/fabric-ca-server

  ca.orderer.wrt.local:
    <<: *ca
    container_name: ca.orderer.wrt.local
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-orderer
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=11054
      - FABRIC_CA_SERVER_CSR_CN=ca.orderer.wrt.local
      - FABRIC_CA_SERVER_CSR_HOSTS=ca.orderer.wrt.local,localhost
    ports: ["11054:11054"]
    volumes:
      - ../organizations/fabric-ca/orderer:/etc/hyperledger/fabric-ca-server

networks:
  wrt:
    name: wrt_net
